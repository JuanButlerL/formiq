<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pedidos - Barritas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Pedidos de Barritas</h1>
    <p class="sub">Minimo de compra: <strong>$40.000</strong></p>

    <section class="card">
      <h2>Datos del cliente</h2>
      <div class="grid">
        <label>Nombre
          <input id="customerName" type="text" required />
        </label>
        <label>Email
          <input id="customerEmail" type="email" required />
        </label>
        <label>Telefono
          <input id="customerPhone" type="tel" required />
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Entrega</h2>
      <div class="row">
        <label><input type="radio" name="deliveryType" value="RETIRO" checked> Retiro</label>
        <label><input type="radio" name="deliveryType" value="ENVIO"> Envio</label>
      </div>
      <div id="addressBox" class="hidden">
        <label>Direccion
          <input id="address" type="text" />
        </label>
      </div>
      <label>Notas
        <input id="notes" type="text" />
      </label>
    </section>

    <section class="card">
      <h2>Productos</h2>
      <div id="products"></div>
    </section>

    <section class="card">
      <h2>Resumen</h2>
      <div class="row space">
        <div>Subtotal</div><div id="subtotal">$0</div>
      </div>
      <div class="row space">
        <div>Envio</div><div id="deliveryFee">$0</div>
      </div>
      <div class="row space total">
        <div>Total</div><div id="total">$0</div>
      </div>

      <p id="error" class="error hidden"></p>

      <button id="submitBtn">Confirmar pedido</button>
      <p id="success" class="success hidden"></p>

      <a id="waLink" class="wa hidden" target="_blank" rel="noreferrer">Enviar por WhatsApp</a>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
